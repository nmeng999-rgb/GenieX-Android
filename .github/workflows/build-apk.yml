
name: Build GenieX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Qualcomm GenieX
        uses: actions/checkout@v4
        with:
          repository: qualcomm/ai-hub-apps
          ref: release
          path: qai-hub-apps
          sparse-checkout: geniex_chat_android
          sparse-checkout-cone-mode: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: qai-hub-apps/geniex_chat_android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenieX-debug-apk
          path: qai-hub-apps/geniex_chat_android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
